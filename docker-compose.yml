version: "3.9"

services:
  hcpcs-app:
    build: .
    container_name: hcpcs-app
    ports:
      - "8010:8000"  
    env_file:
      - .env
    depends_on:
      - hcpcs-db
    restart: unless-stopped

  hcpcs-db:
    image: postgres:15
    container_name: hcpcs-db
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - hcpcs_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hcpcs_postgres_data: